<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机学生来源连接器</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>本机学生来源连接器</h1>
  <p>先在官方教务页登录，打开需要读取的来源页，确认当前查询条件。</p>
  <label for="operation">当前来源页</label>
  <select id="operation"><option value="academic">成绩</option><option value="major_academic">主修成绩</option><option value="timetable">课表</option><option value="exams">考试</option><option value="plan_catalogue">培养方案目录</option></select>
  <button id="register">确认当前来源页</button>
  <label for="port">本机服务端口</label><input id="port" type="number" min="1024" max="65535" value="18976">
  <button id="open-pair">打开本机连接页</button>
  <label for="code">本机页显示的一次性连接码</label><input id="code" type="text" maxlength="128" autocomplete="off" spellcheck="false">
  <button id="pair">连接当前官方标签</button><button id="disconnect">断开</button>
  <p id="status" role="status" aria-live="polite">未连接</p>
  <p class="hint">连接限当前标签及页面实例。重载、退出或切换身份后需重新确认和连接；密码和验证码继续在官方页面输入。</p>
  <p class="hint">扩展标识：<code id="extension-id"></code></p>
  <script src="core.js"></script><script src="popup.js"></script>
</body></html>
